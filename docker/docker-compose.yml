version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - public
      - internal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://cvb:cvb_password@postgres:5432/cvb
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_PHOTOS=photos
      - S3_BUCKET_EXPORTS=exports
      - SESSION_SECRET=change_me_in_production_secret_key_12345
      - AI_PROVIDER=mock
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - internal

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - RENDER_ORIGIN=http://nginx
      - EXPORT_CONCURRENCY=3
    depends_on:
      - redis
      - minio
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cvb
      - POSTGRES_PASSWORD=cvb_password
      - POSTGRES_DB=cvb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - internal

networks:
  public:
  internal:

volumes:
  postgres_data:
  redis_data:
  minio_data:
